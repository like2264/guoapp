name: Upgrade base to author 1.0.8

# 一次性工作流：把仓库整体替换成作者 1.0.8 全量代码（含 6 个站源 + 精准搜索）。
# 用法：仓库根目录放 base-1.0.14.tar.gz，然后手动运行本工作流。
# v5：GitHub App 令牌没有 workflow 权限，提交里只要带了 .github/workflows/ 的任何改动
#     （哪怕只是行尾规范化）就会被服务端拒绝推送。v5 在提交前把 workflow 目录恢复成仓库原版。
# v4：修复 v3 的 bug —— GitHub 不会自动把 GITHUB_TOKEN 注入环境变量，
#     v3 里 "${GITHUB_TOKEN}" 在 set -u 下直接报 unbound variable，0 秒就退出。
#     v4 显式声明 GH_TOKEN，并用 http.extraheader 推送（URL 里不出现 token）。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 探测写权限
        run: |
          set -o pipefail
          echo "仓库：${REPO}"
          echo "HEAD：$(git rev-parse --short HEAD)  $(git rev-parse --abbrev-ref HEAD)"

          code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/git/refs" \
            -d "{\"ref\":\"refs/heads/perm-probe\",\"sha\":\"${GITHUB_SHA}\"}" 2>/dev/null) || code="000"
          echo "创建测试分支 perm-probe → HTTP ${code}"

          if [ "$code" = "201" ]; then
            curl -sS -o /dev/null -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/git/refs/heads/perm-probe" || true
            echo "已删除测试分支（token 具备写权限）"
          fi

          {
            echo "### 写权限探测"
            echo ""
            echo "- 尝试创建测试分支 perm-probe → HTTP **${code}**"
            echo "- 201 = 有写权限；403/404 = 只读"
            echo ""
            echo '```json'
            head -c 400 /tmp/probe.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 解压到临时目录并校验
        run: |
          set -euo pipefail
          test -f base-1.0.14.tar.gz || { echo "仓库根目录找不到 base-1.0.14.tar.gz，已中止（仓库未被修改）"; exit 1; }
          cp base-1.0.14.tar.gz /tmp/base.tar.gz
          rm -rf /tmp/base
          mkdir -p /tmp/base
          tar xzf /tmp/base.tar.gz -C /tmp/base
          for f in pubspec.yaml lib/main.dart native/go.work native/core/provider_registry.go \
                   native/sources/go.mod native/sources/huangtao.go .gitignore \
                   .github/workflows/build.yml scripts/app_build.py; do
            if [ ! -f "/tmp/base/$f" ]; then
              echo "归档里缺少 $f，已中止（仓库未被修改）"
              exit 1
            fi
          done
          echo "版本号: $(grep -m1 '^version:' /tmp/base/pubspec.yaml)"
          echo "文件数: $(find /tmp/base -type f | wc -l)"
          echo "core 下的 go 文件数: $(ls /tmp/base/native/core/*.go | wc -l)"

      - name: 用新基线覆盖工作区
        run: |
          set -euo pipefail
          cp .github/workflows/upgrade-base.yml /tmp/keep-workflow.yml
          shopt -s dotglob
          find . -maxdepth 1 -mindepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/base/. .
          mkdir -p .github/workflows
          cp /tmp/keep-workflow.yml .github/workflows/upgrade-base.yml
          echo "覆盖完成，顶层内容："
          ls -a

      - name: 提交并推送
        run: |
          set -o pipefail
          git config user.name "base-upgrade-bot"
          git config user.email "base-upgrade-bot@users.noreply.github.com"
          git add -A

          # GITHUB_TOKEN 是 GitHub App 的安装令牌，没有 workflow 权限，
          # 任何对 .github/workflows/ 下的改动都会被服务端拒绝推送：
          #   refusing to allow a GitHub App to create or update workflow ...
          # 基线新增的 .gitattributes（* text=auto）会让 git 把 build.yml 重新算作改动，
          # 但两者字节内容其实完全一致，所以直接保留仓库里的原版 workflow。
          wf_reverted=$(git diff --cached --name-only -- .github/workflows | wc -l | tr -d ' ')
          git reset -q HEAD -- .github/workflows 2>/dev/null || true
          git checkout HEAD -- .github/workflows 2>/dev/null || true
          echo "已保留仓库原有 workflow 文件（撤销 ${wf_reverted} 条改动）"

          if [ -n "$(git diff --cached --name-only -- .github/workflows)" ]; then
            echo "仍存在 workflow 变更，已中止（否则推送必被拒绝）"
            exit 1
          fi

          staged=$(git diff --cached --name-only | wc -l | tr -d ' ')
          echo "暂存变更条数：${staged}"
          git diff --cached --name-only | head -20

          {
            echo ""
            echo "### 提交阶段"
            echo ""
            echo "- 暂存变更条数：${staged}"
            echo "- 保留仓库原版 workflow，撤销改动 ${wf_reverted} 条（GITHUB_TOKEN 无 workflow 权限）"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$staged" = "0" ]; then
            echo "没有变更可提交（可能上次已推送成功），跳过。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git commit -m "chore!: 基线升级到作者 1.0.8 全量代码 + 6 站源 + 精准搜索 (1.0.14+114)" > /tmp/commit.log 2>&1; then
            {
              echo ""
              echo "### 提交失败"
              echo '```'
              cat /tmp/commit.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/commit.log
            exit 1
          fi
          echo "提交成功：$(git rev-parse --short HEAD)"

          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          pushed=0
          for attempt in 1 2 3; do
            echo "--- 第 ${attempt} 次推送 ---"
            if git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
                 push "https://github.com/${REPO}.git" HEAD:main > /tmp/push.log 2>&1; then
              pushed=1
              break
            fi
            cat /tmp/push.log
            if git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
                 fetch "https://github.com/${REPO}.git" main > /tmp/fetch.log 2>&1; then
              git rebase FETCH_HEAD > /tmp/rebase.log 2>&1 || { git rebase --abort >/dev/null 2>&1 || true; }
            fi
            sleep 3
          done

          if [ "$pushed" != "1" ]; then
            {
              echo ""
              echo "### 推送失败"
              echo ""
              echo '```'
              cat /tmp/push.log 2>/dev/null
              echo '```'
              echo ""
              echo "### 拉取/变基输出（参考）"
              echo '```'
              cat /tmp/fetch.log /tmp/rebase.log 2>/dev/null
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/push.log 2>/dev/null
            exit 1
          fi
          echo "推送成功：HEAD → main"
          {
            echo ""
            echo "### 推送成功"
            echo ""
            echo "- 提交：$(git rev-parse --short HEAD)"
            echo "- 变更统计：$(git show --stat --oneline HEAD | tail -1)"
            echo ""
            echo "下一步：到 Build app packages 点 Run workflow。"
          } >> "$GITHUB_STEP_SUMMARY"
