          grep -q 'colors.onSurface.withValues(alpha: 0.06)' build-src/lib/ui/detail/detail_page.dart
          grep -q '"version": "1.0.3"' build-src/bundled-modules/huangguo-old/manifest.json
          grep -q '"group": "huangguo"' build-src/bundled-modules/huangguo-old/manifest.json
          test "$(ls build-src/native/core/bundled | grep -c huangguo-old)" = "1"
          echo '---- 拖动卡死 / 封面 / 时间 / 单击收起 / 标签 ----'
          grep -q 'seek_player_error' build-src/lib/playback_session.dart
