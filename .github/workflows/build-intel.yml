name: Build 2.0 patched (iOS · Intel 池)

# 一次性工作流：把仓库根目录的补丁源码包解开，只编 iOS 未签名包。
# 不提交任何内容、不打 tag、不碰 .github/workflows，因此不需要 workflow 权限。

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  PYTHONUTF8: '1'

jobs:
  ios:
    # macos-latest 当前是 arm64（M1），机位经常排队 15 分钟超时；
    # macos-15-intel 是 Intel 池，几乎不排队。
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 解开补丁源码
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src
          mkdir -p build-src
          tar -xzf guoapp-2.0.0+137-full-patch.tar.gz -C build-src
          echo "---- 版本与补丁自检 ----"
          grep -n '^version:' build-src/pubspec.yaml
          grep -n 'NoRedirect' build-src/native/core/provider_host.go
          grep -n 'noRedirect' build-src/native/core/module_script.go
          grep -c 'NativeMergeSearch' build-src/native/core/app_search_precision.go
          grep -n 'searchRelevanceNone' build-src/native/core/app_search_precision.go
          grep -n 'matched == 0' build-src/native/core/app_search_precision.go
          grep -n 'func NativePreciseSearchStrict' build-src/native/core/app_search_precision.go
          grep -n 'const searchProbePages = 6' build-src/native/core/app_runtime.go
          grep -n 'searchProbeBudget = 45' build-src/native/core/app_runtime.go
          grep -c '2.0.0+137' build-src/pubspec.yaml build-src/CHANGELOG.md
          grep -n 'searchAll' build-src/native/core/app_runtime.go
          grep -n 'mediaRefererVariants' build-src/native/core/network_media.go
          grep -n 'nativePrefetchChain' build-src/native/core/app_stream.go
          grep -n "reason == 'seek_stalled'" build-src/lib/playback_session.dart
          grep -n '全站' build-src/lib/ui/search/search_page.dart
          grep -c 'shellBottomInset' build-src/lib/ui/follow/follow_page.dart
          grep -n 'onHorizontalDragStart' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -n '_dragEnd' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -n 'HapticFeedback.selectionClick' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -n 'sigmaX: 0.8' build-src/lib/ui/widgets/glass_tab_bar.dart
          if grep -q '_trail' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '底栏残影没删干净'; exit 1; fi
          if grep -q '_Dividers' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '底栏分隔线没删干净'; exit 1; fi
          grep -n 'class _ScrollRail' build-src/lib/ui/explore/explore_page.dart
          grep -n '_parkFeeds' build-src/lib/explore_feed.dart
          grep -n '_suggestCache' build-src/lib/core_bridge.dart
          grep -n '_suggestQuery' build-src/lib/ui/search/search_page.dart
          grep -n 'bool _composing()' build-src/lib/ui/search/search_page.dart
          grep -n 'final card = ClipRRect' build-src/lib/ui/explore/explore_hero.dart
          grep -n 'class GlassCard' build-src/lib/ui/theme/glass.dart
          grep -n 'glassEnabled' build-src/lib/ui/widgets/page_header.dart
          grep -n 'class SourceFacts' build-src/lib/source_stats.dart
          grep -n 'CatalogTotaler' build-src/native/core/provider_registry.go
          grep -n 'total,omitempty' build-src/native/core/app_runtime.go
          grep -n 'jsProvider) CatalogTotal' build-src/native/core/module_script.go
          grep -n 'state.Total' build-src/native/core/app_catalog_cache.go
          grep -n 'total: catalogTotal' build-src/bundled-modules/xduanju/main.js
          grep -n 'total: knownTotal' build-src/bundled-modules/huangju/main.js
          grep -n 'disk.Version >= 4' build-src/native/core/app_catalog_cache.go
          grep -n 'pageSize: "60"' build-src/bundled-modules/huangju/main.js
          grep -n 'var CATALOG_SIZE = 100;' build-src/bundled-modules/crdj/main.js
          grep -n 'var total = asNumber(pagination.total, 0);' build-src/bundled-modules/crdj/main.js
          if grep -q 'const values = { page: String(page) };' build-src/bundled-modules/huangju/main.js; then echo '剧果还在按 20 条/页 翻'; exit 1; fi
          if grep -q 'pages \* items.length' build-src/bundled-modules/crdj/main.js; then echo '91短剧还在用总页数估总量'; exit 1; fi
          grep -n 'String _summary()' build-src/lib/ui/widgets/drama_grid.dart
          grep -n '已列出 ' build-src/lib/ui/widgets/drama_grid.dart
          grep -n 'total: numbering ? explore.facts.site : null' build-src/lib/ui/explore/explore_page.dart
          for module in huangju crdj; do
            diff -q "build-src/bundled-modules/$module/main.js" "build-src/native/core/bundled/$module/main.js" || { echo "embed 副本没同步: $module"; exit 1; }
          done
          grep -n 'function catalogTotal' build-src/bundled-modules/huangguo-video/main.js
          grep -n 'result.total = total' build-src/bundled-modules/huangguo-video/main.js
          grep -n 'function dataTotal' build-src/bundled-modules/huangguoai/main.js
          grep -n 'result.total = total' build-src/bundled-modules/huangguoai/main.js
          grep -n 'factsSeenLimit' build-src/lib/source_stats.dart
          grep -n 'List<String> readKnown' build-src/lib/source_stats.dart
          grep -n '_noteAll' build-src/lib/explore_feed.dart
          grep -n '_seenDirty' build-src/lib/explore_feed.dart
          grep -n '目录总量' build-src/DEVELOPMENT.md
          grep -n 'String get headline' build-src/lib/source_stats.dart
          grep -n 'subtitleLines' build-src/lib/ui/widgets/source_bar.dart
          grep -n '_lastSiteTotalAt' build-src/lib/explore_feed.dart
          grep -n '_drain' build-src/lib/ui/explore/explore_page.dart
          grep -n 'HapticFeedback.selectionClick' build-src/lib/ui/explore/explore_page.dart
          grep -n 'storeCount' build-src/lib/ui/settings/modules_view.dart
          grep -n 'final int site' build-src/lib/source_stats.dart
          grep -n '_refreshFacts' build-src/lib/explore_feed.dart
          grep -n 'siteTotal' build-src/lib/explore_feed.dart
          grep -n 'final int total' build-src/lib/models.dart
          grep -n 'get sourceStats' build-src/lib/local_store.dart
          grep -n '_track(' build-src/lib/explore_feed.dart
          grep -n 'explore.facts.label' build-src/lib/ui/explore/explore_page.dart
          grep -n 'GlassCard(' build-src/lib/ui/mine/mine_page.dart
          grep -c 'BackdropFilter' build-src/lib/ui/widgets/glass_tab_bar.dart
          echo '---- 弹窗底色与精确匹配高亮 ----'
          grep -n 'dialogFill' build-src/lib/ui/theme/app_theme.dart
          grep -n 'backgroundColor: dialogFill' build-src/lib/ui/theme/app_theme.dart
          grep -n '_ExactBadge' build-src/lib/ui/widgets/drama_tile.dart
          grep -n 'drama.titleMatched' build-src/lib/ui/widgets/drama_tile.dart
          grep -n 'highlight: _submitted' build-src/lib/ui/search/search_page.dart
          grep -n 'final String? highlight;' build-src/lib/ui/widgets/drama_grid.dart
          grep -n 'class OrdinalBadge' build-src/lib/ui/widgets/cover_image.dart
          grep -n 'final int? ordinal;' build-src/lib/ui/widgets/cover_image.dart
          grep -n 'ordinal: ordinal' build-src/lib/ui/widgets/drama_tile.dart
          grep -n 'final int? numberFrom;' build-src/lib/ui/widgets/drama_grid.dart
          grep -n 'numberFrom: numbering ? 1 : null' build-src/lib/ui/explore/explore_page.dart
          grep -n '已经到底了 · 共' build-src/lib/ui/widgets/drama_grid.dart
          if grep -q 'numberFrom' build-src/lib/ui/search/search_page.dart; then echo '搜索页不该有序号'; exit 1; fi
          grep -c 'single-char' build-src/bundled-modules/huangguo-video/main.js
          grep -c 'onHorizontalDragUpdate' build-src/lib/ui/widgets/glass_tab_bar.dart
          if grep -q '_KeepAlivePage' build-src/lib/ui/shell/app_shell.dart; then echo "残留 _KeepAlivePage"; exit 1; fi
          if grep -q 'travel_explore' build-src/lib/ui/explore/explore_page.dart; then echo "残留 全站按钮"; exit 1; fi
          if grep -q '_revealScrollBar' build-src/lib/ui/explore/explore_page.dart; then echo "残留 _revealScrollBar 空调用"; exit 1; fi
          # ---- 2.0.0+128 ----
          grep -n 'case "warm"' build-src/native/core/app_runtime.go
          grep -n 'jsProvider) Warm' build-src/native/core/module_script.go
          grep -n 'warmSource' build-src/native/core/app_warm.go
          grep -n 'baseBuildNumber' build-src/lib/app_device.dart
          grep -n 'StorageCleanup' build-src/lib/ui/settings/storage_view.dart
          grep -n 'SettingsGroup.storage' build-src/lib/ui/settings/settings_sections.dart
          grep -n 'radius - 0.5' build-src/lib/ui/theme/glass.dart
          grep -n '共找到' build-src/lib/ui/search/search_page.dart
          grep -n '_pulseFacts' build-src/lib/explore_feed.dart
          grep -n 'whole ? result.total : 0' build-src/lib/explore_feed.dart
          grep -n '_stopDrain' build-src/lib/ui/explore/explore_page.dart
          grep -n 'lightImpact' build-src/lib/ui/explore/explore_page.dart
          grep -n 'duration - position > 45000' build-src/lib/playback_session.dart
          if grep -q '_idleRelease' build-src/lib/playback_session.dart; then echo "残留 预开宽限计时器"; exit 1; fi
          if grep -q 'duration - position > 30000' build-src/lib/playback_session.dart; then echo "残留 临近片尾才预开"; exit 1; fi
          grep -n 'function catalogTotal' build-src/bundled-modules/huangtao/main.js
          grep -n '站内共有' build-src/bundled-modules/huangtao/main.js
          grep -n 'RE_DETAIL_COUNT' build-src/bundled-modules/yesheai/main.js
          grep -rn 'PACKAGE_NAME: com.guoapp.phoenix2' .github/workflows
          if grep -q '目录请求间隔' build-src/lib/ui/settings/settings_sections.dart; then echo "残留 目录请求间隔"; exit 1; fi
          if grep -q 'SettingsGroup.sources' build-src/lib/ui/settings/settings_sections.dart; then echo "残留 站源分组"; exit 1; fi
          if grep -q 'canDownload ? .查看存储用量' build-src/lib/ui/settings/settings_sections.dart; then echo "残留 目录与空间"; exit 1; fi
          # ---- 2.0.0+128 搜索相关度七档 ----
          grep -n 'func (r searchRelevance) weight()' build-src/native/core/app_search_precision.go
          grep -n 'searchRankTitleStart' build-src/native/core/app_search_precision.go
          grep -n 'searchBonusWordCap' build-src/native/core/app_search_precision.go
          grep -n 'nativeTierBonus' build-src/native/core/app_search_precision.go
          grep -n 'func nativeDramaScore' build-src/native/core/app_search_precision.go
          grep -n 'func (entry scoredDrama) ranked()' build-src/native/core/app_search_precision.go
          grep -n 'json:"rank,omitempty"' build-src/native/core/app_runtime.go
          grep -n 'bool get titleMatched' build-src/lib/models.dart
          grep -n 'rank: fresh.rank > rank ? fresh.rank : rank' build-src/lib/models.dart
          grep -n '精确匹配' build-src/lib/ui/search/search_page.dart
          grep -n '另有 \$related 部相关' build-src/lib/ui/search/search_page.dart
          grep -n 'RANK_EXACT = 7000' build-src/bundled-modules/jinguoduanju/main.js
          grep -n 'function searchScore' build-src/bundled-modules/jinguoduanju/main.js
          grep -n 'search-v3:' build-src/bundled-modules/jinguoduanju/main.js
          grep -n 'clip(clean(introMatch' build-src/bundled-modules/yesheai/main.js
          grep -n 'desc: description' build-src/bundled-modules/yesheai/main.js
          test "$(grep -c 'func Test' build-src/native/core/app_search_precision_test.go | tr -d ' ')" -ge 11
          diff -q build-src/bundled-modules/yesheai/main.js build-src/native/core/bundled/yesheai/main.js
          diff -q build-src/bundled-modules/jinguoduanju/main.js build-src/native/core/bundled/jinguoduanju/main.js
          if grep -q 'search-v2:' build-src/bundled-modules/jinguoduanju/main.js; then echo "残留 search-v2 缓存键"; exit 1; fi
          echo "---- 内置模块 ----"
          ls build-src/bundled-modules
          test "$(ls build-src/bundled-modules | wc -l | tr -d ' ')" = "12"
          grep -m1 '"version"' build-src/bundled-modules/huangguo-video/manifest.json
          grep -m1 '"version"' build-src/bundled-modules/huangju/manifest.json
          grep -n 'categorySearchPage' build-src/bundled-modules/huangguoai/main.js
          grep -n 'categoryFallbacks' build-src/bundled-modules/huangguoai/main.js
          grep -n 'result.total = total.value' build-src/bundled-modules/yeguo/main.js
          grep -n 'result.total = total' build-src/bundled-modules/heitao/main.js
          grep -n 'payload.total = total' build-src/bundled-modules/jinguoduanju/main.js
          grep -m1 '"version"' build-src/bundled-modules/yeguo/manifest.json
          grep -m1 '"version"' build-src/bundled-modules/heitao/manifest.json
          grep -m1 '"version"' build-src/bundled-modules/jinguoduanju/manifest.json
          echo "---- 搜索七档补全 ----"
          for module in crdj heitao huangguo-video huangju huangtao jinguoduanju xduanju youzidj; do
            grep -q 'function attachIntros' "build-src/bundled-modules/$module/main.js" || { echo "缺 attachIntros: $module"; exit 1; }
            grep -q 'function attachIntros' "build-src/native/core/bundled/$module/main.js" || { echo "embed 副本缺 attachIntros: $module"; exit 1; }
          done
          grep -q 'RE_CARD_META' build-src/bundled-modules/xduanju/main.js
          grep -q 'drama-card-tag' build-src/bundled-modules/youzidj/main.js
          grep -q 'htmlFirstClass(card.parent, "des")' build-src/bundled-modules/heitao/main.js
          grep -q 'introUnknown' build-src/bundled-modules/huangtao/main.js
          grep -q 'host.cacheSet("intro:"' build-src/bundled-modules/crdj/main.js
          echo '---- 每页都补简介（不再只补第一页）----'
          for module in crdj heitao huangguo-video huangju huangtao jinguoduanju xduanju youzidj; do
            grep -q 'INTRO_LATER_BUDGET' "build-src/bundled-modules/$module/main.js" || { echo "没有后续页补简介: $module"; exit 1; }
            grep -q 'INTRO_LATER_BUDGET' "build-src/native/core/bundled/$module/main.js" || { echo "embed 副本没有后续页补简介: $module"; exit 1; }
            if grep -q 'if (page !== 1) return;' "build-src/bundled-modules/$module/main.js"; then echo "还在只补第一页: $module"; exit 1; fi
          done
          grep -q '"version": "1.0.4"' build-src/bundled-modules/xduanju/manifest.json
          grep -q '"version": "1.1.4"' build-src/bundled-modules/youzidj/manifest.json
          grep -q '"version": "1.0.3"' build-src/bundled-modules/crdj/manifest.json
          grep -q '"version": "1.0.3"' build-src/bundled-modules/yesheai/manifest.json
          grep -q '"version": "1.0.4"' build-src/bundled-modules/heitao/manifest.json
          grep -q '"version": "1.0.5"' build-src/bundled-modules/huangju/manifest.json
          grep -q '"version": "1.0.5"' build-src/bundled-modules/huangtao/manifest.json
          grep -q '"version": "1.0.6"' build-src/bundled-modules/jinguoduanju/manifest.json
          grep -q '"version": "1.0.9"' build-src/bundled-modules/huangguo-video/manifest.json
          echo '---- 顶栏今日更新：列表带集数 + 新上 N 部 ----'
          grep -q 'flagEpisodes' build-src/bundled-modules/huangtao/main.js
          grep -q 'remarkEpisodes' build-src/bundled-modules/xduanju/main.js
          grep -q 'remarkEpisodes' build-src/bundled-modules/youzidj/main.js
          grep -q 'episodeIndex(remark, 0)' build-src/bundled-modules/huangguo-video/main.js
          grep -q 'episodeCount = episodes' build-src/bundled-modules/yesheai/main.js
          grep -q 'flagEpisodes' build-src/native/core/bundled/huangtao/main.js
          grep -q 'remarkEpisodes' build-src/native/core/bundled/xduanju/main.js
          grep -q 'final arrivedTotal = 0' build-src/lib/source_stats.dart
          grep -q 'countArrivals: true' build-src/lib/explore_feed.dart
          grep -q 'arrived: _facts.arrived' build-src/lib/explore_feed.dart
          echo '---- +135 顶栏统一口径 / 首页更新优先 / 柚子拖动 ----'
          grep -q '今日更新 ${count(updated)} 集' build-src/lib/source_stats.dart
          grep -q 'readEpisodes' build-src/lib/source_stats.dart
          grep -q 'readSeeded' build-src/lib/source_stats.dart
          grep -q 'factsEpisodeLimit' build-src/lib/source_stats.dart
