          # 柚子模块留在 1.1.4：1.1.5 会把画质钉在 720
          grep -n '"version": "1.1.6"' build-src/bundled-modules/youzidj/manifest.json build-src/native/core/bundled/youzidj/manifest.json
          if grep -q 'lightestVariant' build-src/bundled-modules/youzidj/main.js; then echo '柚子模块又变成钉 720 的 1.1.5 了'; exit 1; fi
          echo '---- +146 按站源代理 / 黄果旧版移出内置 / 无封面飞入 / 底栏灰度 ----'
          grep -q 'ProxyBySource' build-src/native/core/app_settings.go
          grep -q 'proxyRoute' build-src/native/core/app_settings.go
          grep -q 'withNativeSource' build-src/native/core/provider_host.go
          grep -q 'nativeSourceKey{}' build-src/native/core/app_settings.go
          grep -q 'Source: p.module.manifest.ID' build-src/native/core/module_script.go
          grep -q 'proxyBySource' build-src/lib/resource_settings.dart
          grep -q 'class SourceProxySettings' build-src/lib/ui/settings/source_proxy_settings.dart
          grep -q 'SourceProxySettings(' build-src/lib/ui/settings/settings_sections.dart
          grep -q 'TestRetiredBundledModuleUsesContentDigest' build-src/native/core/module_retired_test.go
          if grep -q 'child: Hero(' build-src/lib/ui/widgets/cover_image.dart; then echo '详情页封面飞入又回来了'; exit 1; fi
          grep -q 'Colors.black.withValues(alpha: 0.058)' build-src/lib/ui/widgets/glass_tab_bar.dart
          echo '---- +147 播放器 / 卡片浮层 / 序号 / 夜社搜索 / 部数刷新 ----'
          # 暂停时也能单击收起播控；收起后中央留一枚播放图标（96 见方）
          grep -q '_hidden = true' build-src/lib/ui/player/portrait_player_page.dart
          if grep -qF '!_session.paused &&' build-src/lib/ui/player/portrait_player_page.dart; then echo '竖屏暂停又藏不掉播控了'; exit 1; fi
          grep -qF 'width: 96,' build-src/lib/ui/player/portrait_player_page.dart
          # 横屏没进全屏时也能横向滑动调进度
          grep -qF 'enabled: true,' build-src/lib/ui/player/landscape_player_page.dart
          if grep -qF 'enabled: full,' build-src/lib/ui/player/landscape_player_page.dart; then echo '横屏滑动又被全屏开关卡住了'; exit 1; fi
          # 长按浮层：点外面 / 列表滚动 / 长按另一张都自动收
          grep -qF 'onTapOutside' build-src/lib/ui/widgets/drama_tile.dart
          grep -qF 'Scrollable.maybeOf(context)' build-src/lib/ui/widgets/drama_tile.dart
          grep -qF '_openCard' build-src/lib/ui/widgets/drama_tile.dart
          # 头条大卡片不占序号；作品留在列表里，网格从 1 连续编号
          grep -qF 'final numbering =' build-src/lib/ui/explore/explore_page.dart
          grep -qF '!explore.recommending && explore.tab.id == CatalogCategory.all.id' build-src/lib/ui/explore/explore_page.dart
          # 夜社搜索按保留栏目（tid=1/4）搜，不再整站把砍掉的分类倒出来
          grep -qF '/tid/' build-src/bundled-modules/yesheai/main.js
          grep -qF 'searchPath(keyword, index, SECTIONS[i])' build-src/bundled-modules/yesheai/main.js
          # 站点部数变了要作废本次会话的「翻到底实测值」，否则顶栏永远不动
          grep -qF '_listed.remove(source)' build-src/lib/explore_feed.dart
          echo '---- +148 播放器 / 搜索 / 部数刷新 ----'
          # 横屏暂停也能收起播控；竖屏暂停收起后中央播放图标一起隐藏
          grep -qF 'bool get _locked =>' build-src/lib/ui/player/landscape_player_page.dart
          grep -qF 'bool get _pinned => _session.paused || _locked;' build-src/lib/ui/player/landscape_player_page.dart
          if grep -qF 'if (_visible && !_pinned)' build-src/lib/ui/player/landscape_player_page.dart; then echo '横屏暂停又收不起播控了'; exit 1; fi
          grep -qF 'final visible = _visible || _locked;' build-src/lib/ui/player/landscape_player_page.dart
          grep -qF 'final pausedMark = session.ready && session.paused && _chromeShown;' build-src/lib/ui/player/portrait_player_page.dart
          grep -qF 'opacity: pausedMark ? 1 : 0,' build-src/lib/ui/player/portrait_player_page.dart
          # 播放界面「重新播放」：重新取地址后从当前位置接着放
          grep -qF 'void _replay()' build-src/lib/ui/player/landscape_player_page.dart
          grep -qF 'Icons.refresh_rounded' build-src/lib/ui/player/landscape_player_page.dart
          grep -qF "key: const ValueKey('replay')" build-src/lib/ui/player/portrait_player_page.dart
          grep -qF 'unawaited(_session.retry())' build-src/lib/ui/player/portrait_player_page.dart
          # 搜索索引按模块版本作废（夜社砍掉的分类不能再从简介命中漏出来）
          grep -qF 'TestSearchIndexDroppedWhenModuleVersionChanges' build-src/native/core/app_search_index_test.go
          grep -qF 'site.version' build-src/native/core/app_search_index.go
          grep -qF 'func (engine *nativeEngine) dropSearchIndex' build-src/native/core/app_search_index.go
          grep -qF 'engine.dropSearchIndex(source)' build-src/native/core/app_catalog_cache.go
          grep -qF 'engine.dropSearchIndex(name)' build-src/native/core/module_install.go
          # 全站搜索：没有在线搜索能力的模块也要出结果（黄果旧版 1.0.0 只声明了 cover）
          grep -qF 'func (engine *nativeEngine) searchAllSource' build-src/native/core/app_suggestions.go
          grep -qF 'nativeInput{Source: source, Query: query, Page: 1}' build-src/native/core/app_suggestions.go
          grep -qF 'searchIndexPageSlice(engine.searchIndexed(source, query), 1)' build-src/native/core/app_suggestions.go
          grep -qF 'context.WithTimeout(ctx, 35*time.Second)' build-src/native/core/app_suggestions.go
          if sed -n '/func (engine \*nativeEngine) nativeSearchAll/,/^}/p' build-src/native/core/app_suggestions.go | grep -qF 'providerAs[WarningSearcher]'; then echo '全站搜索又按能力表把模块整站跳过'; exit 1; fi
          # 全站搜索「没搜全」的提示搬到顶部，底部只报条数
          grep -qF 'class _IssueNote' build-src/lib/ui/search/search_page.dart
          grep -qF 'onRetry: () =>' build-src/lib/ui/search/search_page.dart
          grep -qF '个站源没搜全' build-src/lib/ui/search/search_page.dart
          if grep -qF 'warning: result.warning' build-src/lib/ui/search/search_page.dart; then echo '全站搜索的失败提示又落回列表底部'; exit 1; fi
          # 翻页空页别再无限转圈
          grep -qF '_emptyPages' build-src/lib/drama_feed.dart
          # 2.0.0+150：空页要连三页才算到底（连两页就把「站点还有货」误判成翻完了）
          grep -qF '_hasMore = page.hasMore && _emptyPages < _emptyPageLimit;' build-src/lib/drama_feed.dart
          grep -qF 'if (section.items.length === 0) {' build-src/bundled-modules/yesheai/main.js
          # 夜社末页余数 10 分钟到期 + 翻到末页当场重算
          grep -qF 'var SECTION_LAST_TTL_MS = 10 * 60 * 1000;' build-src/bundled-modules/yesheai/main.js
          grep -qF 'function forgetSectionLast' build-src/bundled-modules/yesheai/main.js
          grep -qF 'if (page === pages[type] && items.length > 0) {' build-src/bundled-modules/yesheai/main.js
          cmp build-src/bundled-modules/yesheai/main.js build-src/native/core/bundled/yesheai/main.js
          # 顶栏探头单独一条通道：跟列表翻页共用 session 会互相取消（context canceled）
          grep -qF 'lane: probe ? ' build-src/lib/source_catalog.dart
          grep -qF 'bool probe = false,' build-src/lib/source_catalog.dart
          grep -qF 'catalog-$source$lane' build-src/lib/core_bridge.dart
          grep -qF 'String lane = ' build-src/lib/core_bridge.dart
          grep -cF 'probe: true,' build-src/lib/explore_feed.dart
          # 实测条数只在本次会话生效
          grep -qF 'final _listed = <String, int>{};' build-src/lib/explore_feed.dart
          grep -qF 'listed: _listed[source] ?? 0,' build-src/lib/explore_feed.dart
          if grep -qF 'listed: staleListed' build-src/lib/explore_feed.dart; then echo '实测条数又落盘了'; exit 1; fi
          echo '---- +150 三数一致：顶栏 = 底部 = 末位卡片 ----'
          # 底部报实际加载数；顶栏翻到底后跟着它走
          grep -qF 'count: feed.items.length' build-src/lib/ui/explore/explore_page.dart
          # 序号连续：重复卡片不占号，末位卡片 = 列表加载数
          if grep -qF 'List<int> get ordinals' build-src/lib/drama_feed.dart; then echo '序号又回到原始位置了（三数会对不上）'; exit 1; fi
          if grep -qF 'final position = _raw + index + 1;' build-src/lib/drama_feed.dart; then echo '原始位置编号又回来了'; exit 1; fi
          grep -qF 'numberFrom: numbering ? 1 : null,' build-src/lib/ui/explore/explore_page.dart
          # 翻页失败只暂停自动翻页，绝不宣布「已经到底了」
          if grep -v 'bool _hasMore' build-src/lib/drama_feed.dart | grep -qF '_hasMore = false'; then echo '翻页失败又让列表宣布到底了'; exit 1; fi
          grep -qF 'if (_failedPages >= _autoRetryLimit) _autoPaused = true;' build-src/lib/drama_feed.dart
          grep -qF 'bool get stalled => _autoPaused;' build-src/lib/drama_feed.dart
          # 一页部分失败但拿到了作品：不甩错误、不挡后续翻页（野果 1,388 / 夜社 480 的元凶）
          grep -qF "_error = page.items.isEmpty && page.warning.isNotEmpty ? page.warning : '';" build-src/lib/drama_feed.dart
          # 重试只重拉失败的那一页
          grep -qF 'Future<void> retry() async {' build-src/lib/drama_feed.dart
          grep -qF 'onPressed: feed.retry,' build-src/lib/ui/widgets/drama_grid.dart
          # 切源/刷新作废实测值；切回来强制重拉列表，数字和作品一起更新
          grep -qF '_listed.remove(id);' build-src/lib/explore_feed.dart
          grep -qF 'void _dropListed(String source) {' build-src/lib/explore_feed.dart
          grep -qF '_dropListed(catalog.source.id);' build-src/lib/explore_feed.dart
          grep -qF 'final _resumed = <String>{};' build-src/lib/explore_feed.dart
          grep -qF '_resumed.remove(tab.id)' build-src/lib/explore_feed.dart
          # _observe 重建 facts 时不能把实测值洗掉，否则顶栏又掉回站点声明
          if grep -qF '_facts = next;' build-src/lib/explore_feed.dart; then echo '_observe 又把实测条数洗掉了'; exit 1; fi
          # 分类声明值整套删掉，别再回来
          if grep -qF '_tabTotals' build-src/lib/explore_feed.dart; then echo '分类声明值又回来了'; exit 1; fi
          # 测试：三数一致 / 失败不停 / 重试重拉同一页
          grep -qF '翻到底后顶栏、底部、末位卡片是同一个数' build-src/test/explore_feed_test.dart
          grep -qF '翻页连续失败只暂停自动翻页' build-src/test/drama_feed_test.dart
          grep -qF '点重试后接着拉失败的那一页' build-src/test/drama_feed_test.dart
          grep -qF '一页部分失败但拿到了作品' build-src/test/drama_feed_test.dart
          grep -qF '翻到底实测的独立条数优先' build-src/test/source_facts_test.dart
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version-file: build-src/native/go.mod
          cache-dependency-path: build-src/native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 检查 Xcode 与 CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          go version
          flutter --version
          flutter precache --ios

      - name: 构建 iOS 未签名包
        working-directory: build-src
        env:
          GOTOOLCHAIN: auto
          # 新版 macOS runner / Xcode 的签名 pre-flight 检查更严格，即使
          # --no-codesign 也会因为某个 target 没有 development team 而失败
          # （"Building a distributable app requires a selected Development Team"）。
          # Flutter 会把 FLUTTER_XCODE_* 原样作为 build setting 传给 xcodebuild，
          # 这里强制全局关闭签名，向下传递到所有 target（含 Pod bundle、RunnerTests）。
          # 注意：不要设置 FLUTTER_XCODE_PRODUCT_BUNDLE_IDENTIFIER，避免覆盖写_app_config 写入的 bundle id。
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ''
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
          # 与官方 2.0 的 bundle id 保持一致，方便覆盖安装并保留数据
          PACKAGE_NAME: com.guoapp.phoenix2
          # 内置我们自己的自建站源 + 修好的剧果（翻页到底不再报错）。
          # 官方内置的红果仓库需要私有部署密钥，这里不碰。
          # 2.0.0+146 起黄果旧版交回作者自己发模块，不再内置（老用户的残留由
          # native/core/module_bundled.go 的 retiredBundledModules 清掉）。
          # 注意：prepare_bundled_modules() 会先清空 native/core/bundled 再按这个清单复制，
          # 所以清单漏一个，那个模块就真的不会内置。
          BUNDLED_MODULES: >-
            bundled-modules/xduanju,bundled-modules/huangtao,bundled-modules/yesheai,bundled-modules/crdj,bundled-modules/youzidj,bundled-modules/huangguo-video,bundled-modules/huangguoai,bundled-modules/huangju,bundled-modules/yeguo,bundled-modules/heitao,bundled-modules/jinguoduanju
        run: python scripts/build_ios.py

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-patched
          path: build-src/dist/ios/*
          if-no-files-found: error
          retention-days: 14
