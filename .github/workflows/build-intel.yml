          grep -q '_readyPath' build-src/lib/ui/widgets/cover_image.dart
          grep -q 'topLeftBadge' build-src/lib/ui/widgets/drama_tile.dart
          grep -q '_progressClock' build-src/lib/ui/player/portrait_player_page.dart
          grep -q 'canHide' build-src/lib/ui/player/portrait_player_page.dart
          echo '---- +136 玻璃重做 / 三行顶栏 / 新上不虚增 / VIP 角标 / 柚子拖动 ----'
          grep -q 'static const seekGrace' build-src/lib/playback_recovery.dart
          grep -q 'stallTimeout = Duration(seconds: 24)' build-src/lib/playback_recovery.dart
          grep -q 'Future<void> _awaitPicture' build-src/lib/playback_session.dart
          grep -q 'DateTime? _seekAt' build-src/lib/playback_session.dart
          grep -q 'final waiting = seeking || recentSeek' build-src/lib/playback_session.dart
          if grep -q 'arrivalsLabel' build-src/lib/source_stats.dart; then echo '「新上」没删干净'; exit 1; fi
          grep -q "String get updatesLabel" build-src/lib/source_stats.dart
          if grep -q 'arrivalsLabel' build-src/lib/ui/explore/explore_page.dart; then echo '顶栏还在用 arrivalsLabel'; exit 1; fi
          grep -q 'explore.facts.updatesLabel' build-src/lib/ui/explore/explore_page.dart
          grep -q 'IntrinsicWidth' build-src/lib/ui/widgets/page_header.dart
          grep -q 'note: note' build-src/lib/ui/widgets/source_bar.dart
          grep -q 'if (!known.contains(id)) structure = true;' build-src/lib/explore_feed.dart
          grep -q 'var structure = false' build-src/lib/explore_feed.dart
          grep -q 'return [...marked, ...rest]' build-src/lib/explore_feed.dart
          grep -q 'IntrinsicWidth' build-src/lib/ui/widgets/page_header.dart
          grep -q 'hg-card-tag--vip' build-src/bundled-modules/huangguo-video/main.js
          grep -q 'has-vip|is-vip' build-src/bundled-modules/huangguo-video/main.js
          grep -q "episode.vip ? { vip: true }" build-src/bundled-modules/huangguo-video/main.js
          grep -q 'lock' build-src/bundled-modules/xduanju/main.js
          grep -q 'locked ? { vip: true }' build-src/bundled-modules/xduanju/main.js
          grep -q 'hg-card-tag--vip' build-src/native/core/bundled/huangguo-video/main.js
          grep -q 'locked ? { vip: true }' build-src/native/core/bundled/xduanju/main.js
          grep -q 'source: host.source' build-src/bundled-modules/huangguo-old/main.js
          grep -q 'barHeight = 70.0' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -q 'final Color? color' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -q 'Color(0xFF2E7DF6)' build-src/lib/ui/shell/app_shell.dart
          grep -q 'Colors.black.withValues(alpha: dark ? 0.32 : 0.08)' build-src/lib/ui/theme/glass.dart
          grep -q 'spreadRadius: 0.8' build-src/lib/ui/theme/glass.dart
          echo '---- +137 删新上 / 玻璃加厚 / VIP / 封面域名 / 拖动退位 ----'
          grep -q 'final arrivedTotal = 0' build-src/lib/source_stats.dart
          grep -q 'explore.facts.updatesLabel' build-src/lib/ui/explore/explore_page.dart
          grep -q '0xFF9AA3B2).withValues(alpha: 0.16)' build-src/lib/ui/theme/glass.dart
