          grep -qF '下载已经入队，自动退出多选态' build-src/lib/ui/follow/follow_page.dart
          # 2. 底栏改回白色半透明滑块（彩虹填充已删，见 +163 段的反向断言）
          grep -qF 'Colors.white.withValues(alpha: 0.60),' build-src/lib/ui/widgets/glass_tab_bar.dart
          # 3. 手动刷新一律 rebuild；连刷不作废在途 rebuild
          grep -qF 'unawaited(_recount(catalog, reload: true));' build-src/lib/explore_feed.dart
          grep -qF 'bool _rebuilding = false;' build-src/lib/explore_feed.dart
          grep -qF 'if (reload && _rebuilding && _catalog == catalog) return;' build-src/lib/explore_feed.dart

          echo '---- +165 自检 ----'
          # 1. 胶囊恒宽一格、跟手平移：不再拉面条横跨多格
          grep -qF 'final left = _dragging ? baseLeft + _drag : baseLeft;' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -qF 'return (left, cell);' build-src/lib/ui/widgets/glass_tab_bar.dart
          if grep -qF 'cell + _drag' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '胶囊又被拉成长条了'; exit 1; fi
          if grep -qF 'cell - _drag' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '胶囊又被拉成长条了'; exit 1; fi
          # 2. 按住放大并溢出底栏 + 图标文字同步放大
          grep -qF 'bool _pressed = false;' build-src/lib/ui/widgets/glass_tab_bar.dart
          if grep -qF 'final grow =' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '胶囊又加回放大逻辑了'; exit 1; fi
          grep -qF 'clipBehavior: Clip.none,' build-src/lib/ui/widgets/glass_tab_bar.dart
          if grep -qF 'final scale = selected && pressed' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '图标又跟着放大了'; exit 1; fi
          grep -qF 'onTapDown: (_) => _pressDown(),' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -qF 'onTapUp: (_) => _pressUp(),' build-src/lib/ui/widgets/glass_tab_bar.dart
          # 3. +167 已去彩虹光晕（iBox 极简），此处反向确认没残留
          if grep -qF '_haloColors' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '彩虹光晕没删干净'; exit 1; fi
          grep -qF 'AnimatedContainer(' build-src/lib/ui/widgets/glass_tab_bar.dart
          if grep -qF 'alpha: _pressed ? 0.30 : 0.13,' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '光晕柔光没删干净'; exit 1; fi
          grep -qF 'Colors.black.withValues(alpha: 0.058)' build-src/lib/ui/widgets/glass_tab_bar.dart

          echo '---- +166 自检 ----'
          # 1. 布局塌陷修复：Stack 外层补回固定高度约束
          grep -qF 'child: SizedBox(' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -qF 'height: GlassTabBar.barHeight,' build-src/lib/ui/widgets/glass_tab_bar.dart
          # 2. 长条 pill：圆角恒为高度一半，按住横向放大 1.55、纵向只加 6
          grep -qF 'final capRadius = capH / 2;' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -qF 'BorderRadius.circular(capRadius),' build-src/lib/ui/widgets/glass_tab_bar.dart
          if grep -qF 'final grow =' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '胶囊又加回放大逻辑了'; exit 1; fi
          # 3. +167 已去水球动效与按住放大（iBox 极简），反向确认没残留
          if grep -qF '_squash' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '水球动效没删干净'; exit 1; fi
          if grep -qF 'holdLift' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '按住放大溢出没删干净'; exit 1; fi
          if grep -qF 'BorderRadius.circular(28)' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '胶囊又变回方角了'; exit 1; fi
          # 4. pill 缩到比一格小（iBox 尺寸）
          grep -qF 'final capW = capWidth * 0.88;' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -qF 'final capH = baseH - 14;' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -qF 'left: capX,' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -qF 'width: capW,' build-src/lib/ui/widgets/glass_tab_bar.dart

          echo '---- +167 自检 ----'
          # 完全照 iBox 收敛：极简通透，去光晕/去放大/去水球
          grep -qF 'final capH = baseH - 14;' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -qF 'final capW = capWidth * 0.88;' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -qF 'final capX = capLeft + (capWidth - capW) / 2;' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -qF 'final capY = GlassTabBar._pad + (baseH - capH) / 2;' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -qF 'alpha: _pressed ? 0.52 : 0.42,' build-src/lib/ui/widgets/glass_tab_bar.dart
          if grep -qF '_haloColors' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '还带彩虹光晕'; exit 1; fi
          if grep -qF '_squash' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '还带水球动效'; exit 1; fi
          if grep -qF 'final grow =' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '还会按住放大'; exit 1; fi
          if grep -qF 'final scale = selected && pressed' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '图标还会放大'; exit 1; fi
          if grep -qF 'left: capX,' build-src/lib/ui/widgets/glass_tab_bar.dart && grep -qF 'height: 2,' build-src/lib/ui/widgets/glass_tab_bar.dart; then echo '边框光晕条还在'; exit 1; fi

          echo '---- +168 自检 ----'
          # iOS 26+ 底栏换系统原生 UITabBar（真 Liquid Glass），旧系统保留手绘回退
          grep -qF 'native_liquid_glass: ^0.3.1' build-src/pubspec.yaml
          grep -qF "import 'package:native_liquid_glass/native_liquid_glass.dart';" build-src/lib/ui/shell/app_shell.dart
          grep -qF 'glass && NativeLiquidGlassUtils.supportsLiquidGlass' build-src/lib/ui/shell/app_shell.dart
          grep -qF 'LiquidGlassTabBar(' build-src/lib/ui/shell/app_shell.dart
          grep -qF 'NativeLiquidGlassIcon.sfSymbol(_sfSymbol(tab))' build-src/lib/ui/shell/app_shell.dart
          grep -qF 'iosBadgeValue: tab == AppTab.mine ? badge : null,' build-src/lib/ui/shell/app_shell.dart
          grep -qF 'String _sfSymbol(AppTab tab)' build-src/lib/ui/shell/app_shell.dart
          grep -qF "AppTab.explore => 'compass.fill'," build-src/lib/ui/shell/app_shell.dart
          # 低于 26 的系统仍要能回退到手绘胶囊，不能把老系统底栏弄丢
          if ! grep -qF '? GlassTabBar(' build-src/lib/ui/shell/app_shell.dart; then echo '手绘底栏回退丢了'; exit 1; fi
          # 构建必须切 Xcode 26 SDK，否则原生玻璃材质编译不过
          grep -qF 'ls -d /Applications/Xcode_26*.app' .github/workflows/build-intel.yml

          echo '---- +169 自检 ----'
          # 手绘玻璃回退仍在（+170 回退原生容器后同样要求）
          grep -qF 'filter: ImageFilter.blur(sigmaX: blur, sigmaY: blur),' build-src/lib/ui/theme/glass.dart
          # 「发现」图标走 Material 图标栅格化，原生底栏不再丢图标
          grep -qF 'NativeLiquidGlassIcon.iconData(tab.icon)' build-src/lib/ui/shell/app_shell.dart
          grep -qF 'NativeLiquidGlassIcon.iconData(tab.selectedIcon)' build-src/lib/ui/shell/app_shell.dart
          # 外观页不再提供 Liquid Glass 开关
          if grep -qF "title: 'Liquid Glass 外观'" build-src/lib/ui/settings/appearance_settings.dart; then echo '外观开关还在'; exit 1; fi
          grep -qF 'bool get liquidGlass => !pureBlack;' build-src/lib/local_store.dart

          echo '---- +173 自检 ----'
          # 深色发灰 / 内容溢出框外 / 详情页闪白线：全 App 原生玻璃容器撤掉，回手绘
          if grep -qF 'LiquidGlassContainer(' build-src/lib/ui/theme/glass.dart; then echo '原生玻璃容器又回来了'; exit 1; fi
          if grep -qF 'NativeLiquidGlassUtils.supportsLiquidGlass' build-src/lib/ui/theme/glass.dart; then echo '玻璃容器又走原生通道了'; exit 1; fi
          # 发现图标给 24pt，别再撑满整格
          grep -qF 'iconSize: tab == AppTab.explore ? 24 : null,' build-src/lib/ui/shell/app_shell.dart
          # 纯黑深色模式已移除
          if grep -qF "title: '纯黑深色模式'" build-src/lib/ui/settings/appearance_settings.dart; then echo '纯黑开关还在'; exit 1; fi
          grep -qF 'bool get pureBlack => false;' build-src/lib/local_store.dart

          echo '---- +174 自检 ----'
          # iOS VideoToolbox 原始帧硬解直通（只影响 iOS，其他端保持原解码方式）
          test -f build-src/native/ios_mpv/build.py
          test -f build-src/native/ios_mpv/pixelbuffer.inc
          test -f build-src/native/ios_mpv/stage_test_app.py
          test -f build-src/packages/media_kit_video/ios/Classes/plugin/TextureVideoToolbox.swift
          grep -qF 'guoapp-ios-pixelbuffer' build-src/scripts/build_ios.py
          grep -qF 'GuoApp iOS pixel-buffer backend' build-src/ios/Podfile
          grep -qF "'videotoolbox,videotoolbox-copy'" build-src/lib/playback_session.dart
          grep -qF 'enum TelevisionDecoder { optimized, hardwareDirect' build-src/lib/playback_preferences.dart
          grep -qF "TelevisionDecoder.hardwareDirect: '硬解（直通）'" build-src/lib/ui/settings/settings_sections.dart
          grep -qF 'TextureVideoToolbox(handle: handle' build-src/packages/media_kit_video/ios/Classes/plugin/common/VideoOutput.swift
          # 选集时长卡在「32/35 集」：失败批强制重测
          grep -qF 'force: round > 0' build-src/lib/episode_durations.dart
          grep -qF "'force': force" build-src/lib/core_bridge.dart
          grep -qF '最后一批偶发失败会强制重测' build-src/test/episode_durations_test.dart

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version-file: build-src/native/go.mod
          cache-dependency-path: build-src/native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 检查 Xcode 与 CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          # iOS 26+ 的原生 Liquid Glass 材质（UIGlassEffect / glassEffect）需要
          # Xcode 26 SDK 才能编译；macos-15 镜像默认是 16.4，必须显式切过去。
          # 切完 xcrun --sdk iphoneos 会指向新 SDK，Go 交叉编译 target 仍是
          # arm64-apple-ios15.1（新 SDK 向下兼容旧 target，不影响最低系统版本）。
          XCODE26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE26" ]; then
            sudo xcode-select -s "$XCODE26"
          else
            echo '未找到 Xcode 26，原生玻璃底栏无法编译'; exit 1
          fi
          xcode-select -p
          xcodebuild -version
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          go version
          flutter --version
          # +174：VideoToolbox 原始帧后端需要自行编译 libmpv。
          brew install meson ninja cmake pkgconf
          flutter precache --ios

      - name: 构建 iOS 未签名包
        working-directory: build-src
        env:
          GOTOOLCHAIN: auto
          # 新版 macOS runner / Xcode 的签名 pre-flight 检查更严格，即使
          # --no-codesign 也会因为某个 target 没有 development team 而失败
          # （"Building a distributable app requires a selected Development Team"）。
          # Flutter 会把 FLUTTER_XCODE_* 原样作为 build setting 传给 xcodebuild，
          # 这里强制全局关闭签名，向下传递到所有 target（含 Pod bundle、RunnerTests）。
          # 注意：不要设置 FLUTTER_XCODE_PRODUCT_BUNDLE_IDENTIFIER，避免覆盖写_app_config 写入的 bundle id。
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ''
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
          # 与官方 2.0 的 bundle id 保持一致，方便覆盖安装并保留数据
          PACKAGE_NAME: com.guoapp.phoenix2
          # 内置我们自己的自建站源 + 修好的剧果（翻页到底不再报错）。
          # 官方内置的红果仓库需要私有部署密钥，这里不碰。
          # 2.0.0+146 起黄果旧版交回作者自己发模块，不再内置（老用户的残留由
          # native/core/module_bundled.go 的 retiredBundledModules 清掉）。
          # 注意：prepare_bundled_modules() 会先清空 native/core/bundled 再按这个清单复制，
          # 所以清单漏一个，那个模块就真的不会内置。
          BUNDLED_MODULES: >-
            bundled-modules/xduanju,bundled-modules/huangtao,bundled-modules/yesheai,bundled-modules/crdj,bundled-modules/youzidj,bundled-modules/huangguo-video,bundled-modules/huangguoai,bundled-modules/huangju,bundled-modules/yeguo,bundled-modules/heitao,bundled-modules/jinguoduanju
        run: python scripts/build_ios.py

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-patched
          path: build-src/dist/ios/*
          if-no-files-found: error
          retention-days: 14
