name: Build 2.0 patched (iOS)

# 一次性工作流：把仓库根目录的补丁源码包解开，只编 iOS 未签名包。
# 不提交任何内容、不打 tag、不碰 .github/workflows，因此不需要 workflow 权限。

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  PYTHONUTF8: '1'

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: 解开补丁源码
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src
          mkdir -p build-src
          tar -xzf guoapp-2.0.0+119-full-patch.tar.gz -C build-src
          echo "---- 版本与补丁自检 ----"
          grep -n '^version:' build-src/pubspec.yaml
          grep -n 'NoRedirect' build-src/native/core/provider_host.go
          grep -n 'noRedirect' build-src/native/core/module_script.go
          grep -c 'NativeMergeSearch' build-src/native/core/app_search_precision.go
          grep -n 'searchRelevanceNone' build-src/native/core/app_search_precision.go
          grep -n 'matched == 0' build-src/native/core/app_search_precision.go
          grep -c '2.0.0+119' build-src/pubspec.yaml build-src/CHANGELOG.md
          grep -n 'searchAll' build-src/native/core/app_runtime.go
          grep -n 'mediaRefererVariants' build-src/native/core/network_media.go
          grep -n 'nativePrefetchChain' build-src/native/core/app_stream.go
          grep -n 'seek_stalled_14s' build-src/lib/playback_session.dart
          grep -n '全站' build-src/lib/ui/search/search_page.dart
          grep -c 'shellBottomInset' build-src/lib/ui/follow/follow_page.dart
          grep -n 'onSwipe' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -n '_swipeTab' build-src/lib/ui/shell/app_shell.dart
          grep -n 'Listener' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -n '_scrollBarThumb' build-src/lib/ui/explore/explore_page.dart
          grep -c 'BackdropFilter' build-src/lib/ui/widgets/glass_tab_bar.dart
          grep -c 'single-char' build-src/bundled-modules/huangguo-video/main.js
          grep -c 'onHorizontalDragUpdate' build-src/lib/ui/widgets/glass_tab_bar.dart
          if grep -q '_KeepAlivePage' build-src/lib/ui/shell/app_shell.dart; then echo "残留 _KeepAlivePage"; exit 1; fi
          if grep -q 'travel_explore' build-src/lib/ui/explore/explore_page.dart; then echo "残留 全站按钮"; exit 1; fi
          echo "---- 内置模块 ----"
          ls build-src/bundled-modules
          test "$(ls build-src/bundled-modules | wc -l | tr -d ' ')" = "8"
          grep -m1 '"version"' build-src/bundled-modules/huangguo-video/manifest.json
          grep -m1 '"version"' build-src/bundled-modules/huangju/manifest.json
          grep -n 'categorySearchPage' build-src/bundled-modules/huangguoai/main.js
          grep -n 'categoryFallbacks' build-src/bundled-modules/huangguoai/main.js
          ls build-src/native/core/bundled

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version-file: build-src/native/go.mod
          cache-dependency-path: build-src/native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 检查 Xcode 与 CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          go version
          flutter --version
          flutter precache --ios

      - name: 构建 iOS 未签名包
        working-directory: build-src
        env:
          GOTOOLCHAIN: auto
          # 与官方 2.0 的 bundle id 保持一致，方便覆盖安装并保留数据
          PACKAGE_NAME: com.yingshib.xg
          # 内置我们自己的 7 个自建站源 + 修好的剧果（1.0.2，翻页到底不再报错）。
          # 官方内置的红果仓库需要私有部署密钥，这里不碰。
          BUNDLED_MODULES: >-
            bundled-modules/xduanju,bundled-modules/huangtao,bundled-modules/yesheai,bundled-modules/crdj,bundled-modules/youzidj,bundled-modules/huangguo-video,bundled-modules/huangguoai,bundled-modules/huangju
        run: python scripts/build_ios.py

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-patched
          path: build-src/dist/ios/*
          if-no-files-found: error
          retention-days: 14
