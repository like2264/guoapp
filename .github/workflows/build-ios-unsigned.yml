name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          xcodebuild -version
          pod --version
          go version
          flutter --version
          flutter precache --ios

      - name: Build unsigned IPA
        run: python scripts/build_ios.py --all-sources

      - name: Verify IPA exists
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/ios/*.ipa
          file dist/ios/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-ios-unsigned-ipa
          path: dist/ios/*.ipa
          if-no-files-found: error
          retention-days: 14
